# Release automation: on a version tag, verify, publish to npm, and create
# the GitHub release.
#
# One-time setup: add the repository secret NPM_TOKEN (an npm automation token
# with publish access for the @hilbras org) under Settings -> Secrets and
# variables -> Actions. Until it exists, the gates pass and the publish step
# fails visibly at that step.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The release gates (version consistency, package contents, secret
      # scan) must run before anything is published — the publish path used
      # to skip them entirely.
      - run: npm run gates
      # The tag must name the version being published, otherwise a
      # mismatched tag publishes silently.
      - name: Check the tag matches the package version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package version $package_version"
            exit 1
          fi
      - name: Publish to npm
        # Prereleases (v2.0.0-alpha.1) go to the `next` tag; stable releases
        # to `latest`.
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true