# Release automation: on a version tag, verify, publish to npm, and create
# the GitHub release.
#
# One-time setup: add the repository secret NPM_TOKEN (an npm automation token
# with publish access for the @hilbras org) under Settings -> Secrets and
# variables -> Actions. Until it exists, the gates pass and the publish step
# fails visibly at that step.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true