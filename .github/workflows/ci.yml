# Full gate for every push and pull request (roadmap §26).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # `npm ci` fails if package.json and package-lock.json disagree (lockfile check).
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Dependency audit (security section of the roadmap) — once, to avoid noise.
      - if: matrix.node == 24
        run: npm audit --audit-level=high

  # Windows lane (v3 roadmap, quick win A): the platform-specific process and
  # CLI behavior documented in SECURITY.md / AGENTS.md is otherwise only
  # exercised on ubuntu-latest. POSIX-only process-group tests graceful-skip
  # via it.skipIf(win32); everything else must pass on Windows.
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The built binary must start on Windows too.
      - run: npm run smoke:cli

  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run build
      # CLI smoke test: the built binary must start outside the source tree.
      - run: npm run smoke:cli
      # Coverage gate (v3 quick win C): run the suite with the v8 coverage
      # provider and enforce the do-not-decrease thresholds from vitest.config.ts.
      - run: npm run test:coverage
      # Version/changelog consistency, package contents, secret scan.
      - run: npm run gates
